name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  notarized-macos:
    name: Signed and notarized macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Verify tag and app version
        run: |
          set -euo pipefail
          git fetch \
            --no-tags \
            origin \
            +refs/heads/main:refs/remotes/origin/main
          tag_commit="$(git rev-parse "${GITHUB_REF}^{commit}")"
          test "$tag_commit" = "$(git rev-parse HEAD)"
          if ! git merge-base \
            --is-ancestor \
            "$tag_commit" \
            refs/remotes/origin/main; then
            echo "Release tag commit is not part of origin/main: $tag_commit" >&2
            exit 1
          fi
          version="$(
            /usr/libexec/PlistBuddy \
              -c 'Print :CFBundleShortVersionString' \
              Resources/Info.plist
          )"
          test "${GITHUB_REF_NAME}" = "v${version}"

      - name: Reject unsafe tagged source before loading credentials
        run: python3 scripts/verify-release-safety.py --tracked-only

      - name: Import Developer ID certificate
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_CI_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          : "${CERTIFICATE_P12_BASE64:?Missing APPLE_DEVELOPER_ID_P12_BASE64}"
          : "${CERTIFICATE_PASSWORD:?Missing APPLE_DEVELOPER_ID_P12_PASSWORD}"
          : "${KEYCHAIN_PASSWORD:?Missing APPLE_CI_KEYCHAIN_PASSWORD}"
          certificate="$RUNNER_TEMP/developer-id.p12"
          keychain="$RUNNER_TEMP/officestra-signing.keychain-db"
          printf '%s' "$CERTIFICATE_P12_BASE64" \
            | /usr/bin/base64 -D > "$certificate"
          /usr/bin/security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          /usr/bin/security set-keychain-settings -lut 21600 "$keychain"
          /usr/bin/security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          /usr/bin/security import "$certificate" \
            -k "$keychain" \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          /usr/bin/security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$keychain"
          /usr/bin/security list-keychains -d user -s "$keychain"
          /usr/bin/security default-keychain -d user -s "$keychain"
          rm -f "$certificate"
          echo "OFFICESTRA_CI_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Configure Apple notarization credentials
        env:
          APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_NOTARY_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_NOTARY_APP_PASSWORD }}
        run: |
          set -euo pipefail
          : "${APPLE_ID:?Missing APPLE_NOTARY_APPLE_ID}"
          : "${APPLE_TEAM_ID:?Missing APPLE_NOTARY_TEAM_ID}"
          : "${APPLE_APP_PASSWORD:?Missing APPLE_NOTARY_APP_PASSWORD}"
          /usr/bin/xcrun notarytool store-credentials OFFICESTRA-CI \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD"

      - name: Test, build, sign, and notarize
        run: |
          set -euo pipefail
          npm --prefix backend ci --ignore-scripts --no-audit --no-fund
          npm --prefix backend run check
          npm --prefix backend test
          swift test -Xswiftc -warnings-as-errors
          identity="$(
            /usr/bin/security find-identity -v -p codesigning \
              | /usr/bin/sed -n \
                's/.*"\(Developer ID Application:[^"]*\)".*/\1/p' \
              | /usr/bin/head -n 1
          )"
          test -n "$identity"
          OFFICESTRA_NODE_EXECUTABLE="$(command -v node)" \
          OFFICESTRA_CODESIGN_IDENTITY="$identity" \
            ./scripts/build-app.sh
          python3 scripts/backend-release-id.py \
            --verify \
            --verify-node-signature \
            dist/OFFICESTRA.app
          python3 scripts/verify-release-safety.py --require-app
          app_architecture="$(
            /usr/bin/lipo -archs dist/OFFICESTRA.app/Contents/MacOS/OfficeLLM
          )"
          node_architecture="$(
            /usr/bin/lipo -archs \
              dist/OFFICESTRA.app/Contents/Resources/OFFICESTRARuntime/node/bin/node
          )"
          test "$app_architecture" = "${{ matrix.arch }}"
          test "$node_architecture" = "$app_architecture"
          OFFICESTRA_NOTARY_PROFILE=OFFICESTRA-CI \
            ./scripts/notarize-app.sh
          ./scripts/smoke-test-macos-release.sh dist/OFFICESTRA.app
          OFFICESTRA_CODESIGN_IDENTITY="$identity" \
          OFFICESTRA_NOTARY_PROFILE=OFFICESTRA-CI \
            ./scripts/package-release.sh
          dmg_path="$(
            find dist/release \
              -maxdepth 1 \
              -type f \
              -name '*-notarized.dmg' \
              -print \
              -quit
          )"
          test -n "$dmg_path"
          /usr/bin/xcrun stapler validate "$dmg_path"
          /usr/sbin/spctl \
            --assess \
            --type open \
            --context context:primary-signature \
            --verbose=4 \
            "$dmg_path"
          ./scripts/smoke-test-macos-release.sh "$dmg_path"
          (
            cd dist/release
            shasum -a 256 -c SHA256SUMS
          )

      - name: Stage the signed packaged runtime for Docker E2E
        run: |
          set -euo pipefail
          source_app="dist/OFFICESTRA.app"
          staging="dist/packaged-runtime-e2e/OFFICESTRA.app/Contents"
          mkdir -p "$staging/Resources/OfficeLLM_OfficeCore.bundle"
          cp "$source_app/Contents/Info.plist" "$staging/Info.plist"
          cp \
            "$source_app/Contents/Resources/OfficeLLM_OfficeCore.bundle/characters.json" \
            "$staging/Resources/OfficeLLM_OfficeCore.bundle/characters.json"
          rsync -a \
            --exclude 'node/bin/node' \
            "$source_app/Contents/Resources/OFFICESTRARuntime/" \
            "$staging/Resources/OFFICESTRARuntime/"
          tar -czf \
            "dist/packaged-runtime-e2e-${{ matrix.arch }}.tgz" \
            -C dist/packaged-runtime-e2e \
            OFFICESTRA.app

      - name: Upload notarized architecture artifacts
        uses: actions/upload-artifact@v4
        with:
          name: officestra-release-${{ matrix.arch }}
          path: |
            dist/release/*-notarized.zip
            dist/release/*-notarized.dmg
          if-no-files-found: error
          retention-days: 7

      - name: Upload packaged runtime E2E fixture
        uses: actions/upload-artifact@v4
        with:
          name: officestra-runtime-e2e-${{ matrix.arch }}
          path: dist/packaged-runtime-e2e-${{ matrix.arch }}.tgz
          if-no-files-found: error
          retention-days: 2

      - name: Remove temporary keychain
        if: always()
        run: |
          if [[ -n "${OFFICESTRA_CI_KEYCHAIN:-}" ]]; then
            /usr/bin/security delete-keychain "$OFFICESTRA_CI_KEYCHAIN" || true
          fi

  packaged-runtime-e2e:
    name: Packaged first task (${{ matrix.arch }})
    needs: notarized-macos
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        arch:
          - arm64
          - x86_64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download the signed packaged runtime
        uses: actions/download-artifact@v4
        with:
          name: officestra-runtime-e2e-${{ matrix.arch }}
          path: dist

      - name: Run the packaged runtime against Docker
        run: |
          set -euo pipefail
          mkdir -p dist/packaged-runtime-e2e
          tar -xzf \
            "dist/packaged-runtime-e2e-${{ matrix.arch }}.tgz" \
            -C dist/packaged-runtime-e2e
          OFFICESTRA_PACKAGED_E2E_NODE_EXECUTABLE="$(command -v node)" \
            ./scripts/test-packaged-community-preview-e2e.sh \
              dist/packaged-runtime-e2e/OFFICESTRA.app

  publish:
    name: Publish GitHub release
    needs:
      - notarized-macos
      - packaged-runtime-e2e
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all notarized architectures
        uses: actions/download-artifact@v4
        with:
          pattern: officestra-release-*
          path: dist/release
          merge-multiple: true

      - name: Verify release set and create checksums
        run: |
          set -euo pipefail
          shopt -s nullglob
          arm_zip=(dist/release/*-arm64-notarized.zip)
          intel_zip=(dist/release/*-x86_64-notarized.zip)
          arm_dmg=(dist/release/*-arm64-notarized.dmg)
          intel_dmg=(dist/release/*-x86_64-notarized.dmg)
          test "${#arm_zip[@]}" -eq 1
          test "${#intel_zip[@]}" -eq 1
          test "${#arm_dmg[@]}" -eq 1
          test "${#intel_dmg[@]}" -eq 1
          (
            cd dist/release
            sha256sum ./*.zip ./*.dmg > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - name: Publish GitHub release once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            dist/release/*-notarized.zip \
            dist/release/*-notarized.dmg \
            dist/release/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "OFFICESTRA ${GITHUB_REF_NAME}"
