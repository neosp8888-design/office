name: Community Preview Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to package as an ad-hoc Community Preview
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  preview-macos:
    name: Ad-hoc Community Preview macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}

      - name: Verify tag and app version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          case "$RELEASE_TAG" in
            v*) ;;
            *)
              echo "Release tag must start with v: $RELEASE_TAG" >&2
              exit 1
              ;;
          esac
          git fetch \
            --no-tags \
            origin \
            +refs/heads/main:refs/remotes/origin/main
          git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}"
          tag_commit="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          test "$tag_commit" = "$(git rev-parse HEAD)"
          if ! git merge-base \
            --is-ancestor \
            "$tag_commit" \
            refs/remotes/origin/main; then
            echo "Release tag commit is not part of origin/main: $tag_commit" >&2
            exit 1
          fi
          version="$(
            /usr/libexec/PlistBuddy \
              -c 'Print :CFBundleShortVersionString' \
              Resources/Info.plist
          )"
          test "$RELEASE_TAG" = "v${version}"

      - name: Require exact release UI preflight
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag_commit="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          preflight_url="$(
            gh api \
              --paginate \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/release-ui-preflight.yml/runs?event=workflow_dispatch&status=success&per_page=100" \
              --jq '.workflow_runs[] | [.head_sha, .html_url] | @tsv' \
              | awk -F '\t' -v sha="$tag_commit" \
                  '$1 == sha { url=$2 } END { print url }'
          )"
          if [[ -z "$preflight_url" ]]; then
            echo \
              "No successful Release UI Preflight exists for ${tag_commit}." \
              >&2
            echo \
              "Run release-ui-preflight.yml on that exact main commit before tagging." \
              >&2
            exit 1
          fi
          echo "Using Release UI Preflight: $preflight_url"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Reject unsafe tagged source
        run: python3 scripts/verify-release-safety.py --tracked-only

      - name: Test, build, and package ad-hoc preview
        run: |
          set -euo pipefail
          npm --prefix backend ci --ignore-scripts --no-audit --no-fund
          npm --prefix backend run check
          npm --prefix backend test
          /usr/bin/defaults write NSGlobalDomain AppleLanguages -array ko
          swift test -Xswiftc -warnings-as-errors
          OFFICESTRA_NODE_EXECUTABLE="$(command -v node)" \
          OFFICESTRA_CODESIGN_IDENTITY=- \
            ./scripts/build-app.sh
          python3 scripts/backend-release-id.py \
            --verify \
            --verify-node-signature \
            dist/OFFICESTRA.app
          python3 scripts/verify-release-safety.py --require-app
          signature_details="$(
            /usr/bin/codesign -dv --verbose=4 dist/OFFICESTRA.app 2>&1
          )"
          printf '%s\n' "$signature_details" | /usr/bin/grep -q '^Signature=adhoc$'
          app_architecture="$(
            /usr/bin/lipo -archs dist/OFFICESTRA.app/Contents/MacOS/OfficeLLM
          )"
          node_architecture="$(
            /usr/bin/lipo -archs \
              dist/OFFICESTRA.app/Contents/Resources/OFFICESTRARuntime/node/bin/node
          )"
          test "$app_architecture" = "${{ matrix.arch }}"
          test "$node_architecture" = "$app_architecture"
          ./scripts/smoke-test-macos-release.sh dist/OFFICESTRA.app
          ./scripts/package-release.sh
          zip_path="$(
            find dist/release \
              -maxdepth 1 \
              -type f \
              -name '*-adhoc.zip' \
              -print \
              -quit
          )"
          test -n "$zip_path"
          ./scripts/smoke-test-macos-release.sh "$zip_path"
          (
            cd dist/release
            shasum -a 256 -c SHA256SUMS
          )

      - name: Stage the packaged runtime for Docker E2E
        run: |
          set -euo pipefail
          source_app="dist/OFFICESTRA.app"
          staging="dist/packaged-runtime-e2e/OFFICESTRA.app/Contents"
          mkdir -p "$staging/Resources/OfficeLLM_OfficeCore.bundle"
          cp "$source_app/Contents/Info.plist" "$staging/Info.plist"
          cp \
            "$source_app/Contents/Resources/OfficeLLM_OfficeCore.bundle/characters.json" \
            "$staging/Resources/OfficeLLM_OfficeCore.bundle/characters.json"
          rsync -a \
            --exclude 'node/bin/node' \
            "$source_app/Contents/Resources/OFFICESTRARuntime/" \
            "$staging/Resources/OFFICESTRARuntime/"
          tar -czf \
            "dist/packaged-runtime-e2e-${{ matrix.arch }}.tgz" \
            -C dist/packaged-runtime-e2e \
            OFFICESTRA.app

      - name: Upload ad-hoc architecture artifacts
        uses: actions/upload-artifact@v4
        with:
          name: officestra-preview-release-${{ matrix.arch }}
          path: dist/release/*-adhoc.zip
          if-no-files-found: error
          retention-days: 7

      - name: Upload packaged runtime E2E fixture
        uses: actions/upload-artifact@v4
        with:
          name: officestra-preview-runtime-e2e-${{ matrix.arch }}
          path: dist/packaged-runtime-e2e-${{ matrix.arch }}.tgz
          if-no-files-found: error
          retention-days: 2

  packaged-runtime-e2e:
    name: Packaged preview first task (${{ matrix.arch }})
    needs: preview-macos
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        arch:
          - arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download the packaged runtime
        uses: actions/download-artifact@v4
        with:
          name: officestra-preview-runtime-e2e-${{ matrix.arch }}
          path: dist

      - name: Run the packaged runtime against Docker
        run: |
          set -euo pipefail
          mkdir -p dist/packaged-runtime-e2e
          tar -xzf \
            "dist/packaged-runtime-e2e-${{ matrix.arch }}.tgz" \
            -C dist/packaged-runtime-e2e
          OFFICESTRA_PACKAGED_E2E_NODE_EXECUTABLE="$(command -v node)" \
            ./scripts/test-packaged-community-preview-e2e.sh \
              dist/packaged-runtime-e2e/OFFICESTRA.app

  publish:
    name: Publish Community Preview
    needs:
      - preview-macos
      - packaged-runtime-e2e
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Apple Silicon preview artifacts
        uses: actions/download-artifact@v4
        with:
          name: officestra-preview-release-arm64
          path: dist/release

      - name: Verify release set and create checksums
        run: |
          set -euo pipefail
          shopt -s nullglob
          arm_zip=(dist/release/*-arm64-adhoc.zip)
          test "${#arm_zip[@]}" -eq 1
          test "$(find dist/release -maxdepth 1 -name '*.dmg' | wc -l | tr -d ' ')" = 0
          (
            cd dist/release
            sha256sum ./*.zip > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - name: Publish GitHub prerelease once
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/community-preview-notes.md"
          cat > "$notes" <<'EOF'
          ## Community Preview — Apple 미공증

          이 ZIP의 앱은 ad-hoc 서명되었으며 Apple Developer ID 서명이나 Apple 공증을 받지 않았습니다. macOS가 첫 실행을 차단할 수 있습니다. 이 공식 저장소에서 받은 파일인지 확인하고 `SHA256SUMS`와 일치할 때만 앱 하나에 대한 예외를 허용하세요.

          이 릴리스는 Apple Silicon(M1 이상) 전용입니다. Intel Mac은 지원하지 않습니다.

          1. `arm64` ZIP을 받아 압축을 풉니다.
          2. `OFFICESTRA.app`을 Applications로 옮긴 뒤 한 번 실행합니다.
          3. 차단되면 `시스템 설정 → 개인정보 보호 및 보안 → 보안 → 그래도 열기`에서 이 앱만 허용합니다.

          ZIP과 `SHA256SUMS`를 같은 폴더에 받은 뒤 `grep -- '-arm64-adhoc.zip$' SHA256SUMS | shasum -a 256 -c -`를 실행해 `OK`를 확인합니다.

          Gatekeeper 전체 비활성화나 광범위한 `xattr` 명령은 필요하지 않으며 권장하지 않습니다. 보안 예외를 원치 않으면 이 태그의 소스를 직접 빌드하세요. 체크섬은 파일 무결성만 확인하며 Apple 공증을 대신하지 않습니다.

          ## Community Preview — not notarized by Apple

          The app in this ZIP is ad-hoc signed. It is not Developer ID signed or notarized by Apple, so macOS may block the first launch. Download only from this official repository and verify the matching `SHA256SUMS` before allowing a per-app exception.

          This release supports Apple silicon (M1 or later) only. Intel Macs are not supported.

          Extract the ZIP, move `OFFICESTRA.app` to Applications, attempt one launch, then use `System Settings → Privacy & Security → Security → Open Anyway` if macOS blocks it. Do not disable Gatekeeper globally or run broad `xattr` commands. Build this tag from source instead if you do not want to allow the exception. Checksums verify file integrity; they do not replace Apple notarization.

          Place the ZIP and `SHA256SUMS` in one folder and run `grep -- '-arm64-adhoc.zip$' SHA256SUMS | shasum -a 256 -c -`; require an `OK` result.
          EOF
          gh release create "$RELEASE_TAG" \
            dist/release/*-adhoc.zip \
            dist/release/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --prerelease \
            --notes-file "$notes" \
            --title "OFFICESTRA ${RELEASE_TAG} Community Preview (Apple Silicon, Apple Unnotarized)"
