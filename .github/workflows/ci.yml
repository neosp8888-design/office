name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - README.md
      - README.en.md
      - "docs/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-first-task:
    name: Backend first task
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: >-
          npm --prefix backend ci
          --ignore-scripts
          --no-audit
          --no-fund

      - name: Run first-task integration
        run: ./scripts/test-community-preview-e2e.sh

  verify:
    name: Backend and Swift
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: >-
          npm --prefix backend ci
          --ignore-scripts
          --no-audit
          --no-fund

      - name: Check backend syntax
        run: npm --prefix backend run check

      - name: Test backend
        run: npm --prefix backend test

      - name: Test Swift package
        run: |
          /usr/bin/defaults write NSGlobalDomain AppleLanguages -array ko
          swift test -Xswiftc -warnings-as-errors

      - name: Check repository and YAML syntax
        run: |
          set -euo pipefail
          git diff --check
          ruby -e \
            'require "yaml"; YAML.safe_load(File.read(ARGV.fetch(0)), aliases: true)' \
            .github/workflows/ci.yml
          ruby -e \
            'require "yaml"; YAML.safe_load(File.read(ARGV.fetch(0)), aliases: true)' \
            infra/compose.yaml
