services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: office
      POSTGRES_USER: office
      POSTGRES_PASSWORD: office-local
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - office-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U office -d office"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  office-postgres-data:
