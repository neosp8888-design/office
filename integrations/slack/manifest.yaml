display_information:
  name: OFFICESTRA
  description: Codex와 Claude 직원을 Slack에서 호출하고 진행 상황을 확인합니다.
  background_color: "#17324D"
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: OFFICESTRA
    always_online: true
  slash_commands:
    - command: /office
      description: OFFICESTRA 직원을 선택합니다.
      usage_hint: 직원 선택
      should_escape: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - commands
      - im:history
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.im
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
