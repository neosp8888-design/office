<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' http://127.0.0.1:* http://localhost:* ws://127.0.0.1:* ws://localhost:*; img-src 'self' data: blob:; style-src 'self'; script-src 'self'; base-uri 'none'; form-action 'none'">
  <title>OFFICESTRA Conversation</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <main id="conversation" aria-label="직원 대화">
    <div id="status-rail" aria-live="polite" aria-atomic="true">
      <span id="status-banner" class="status-banner" hidden>
        <span class="status-spinner" aria-hidden="true"></span>
        <span id="status-text">대화를 불러오는 중</span>
      </span>
      <button id="retry-button" class="retry-button" type="button" hidden>다시 시도</button>
    </div>

    <section id="feed-scroller" tabindex="0" aria-label="대화 목록">
      <button id="load-older" class="load-older" type="button" hidden>
        이전 대화 불러오기
      </button>
      <div id="feed" role="feed" aria-busy="true"></div>
      <div id="bottom-sentinel" aria-hidden="true"></div>
    </section>

    <button id="jump-bottom" class="jump-bottom" type="button" hidden>
      최신 대화로
    </button>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  </main>
  <script src="app.js"></script>
</body>
</html>
